- id: kraithz-546252
  title: 30-second Hollywood-grade showreel with sound design
  title_zh: 对标好莱坞的 30 秒动效作品集
  url: https://x.com/kraithz/status/2103537329306546252
  author: kraithz
  author_name: java
  platform: x
  date: '2026-09-25'
  description: A 30-second motion graphics showreel with its own sound design, made entirely in code without MCP servers or extra skills.
  description_zh: 30 秒动效作品集，音效也自己设计，全程只写代码，没用 MCP 或额外的 skill。
  prompt: |-
    Make a dynamic 30-second motion graphics video that shows what an incredible motion designer you are, like a showreel for your resume to show dominance among top Hollywood motion designers.

    You also come up with your own sound design.

    Go all out, don't hold back, and show me how incredible you can be at the peak of your creativity and design perspective.
  prompt_lang: en
