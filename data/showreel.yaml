    thumb: https://pbs.twimg.com/amplify_video_thumb/2104182227026251776/img/OOPwBWLIP1t2MHCW.jpg
    video: https://video.twimg.com/amplify_video/2104182227026251776/vid/avc1/320x400/UhfnUlxqXkt2e6dc.mp4?tag=29
    video_hd: https://video.twimg.com/amplify_video/2104182227026251776/vid/avc1/720x900/tGIB96CImdYeTbvJ.mp4?tag=29
    duration: 30
