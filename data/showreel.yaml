  description: 'A 15-second motion design résumé reel on max effort: a hook in the first second, then typography, shape play, camera moves and colour shifts, paced as if cut to music.'
  description_zh: max 档做的 15 秒动效简历短片：第一秒给钩子，接着是字体、形状、镜头运动和色彩变化，节奏像卡着音乐剪。
  prompt: 'You''re a world-class motion designer, and this is your 15-second résumé reel. Make it dynamic and confident: open with a striking hook in the first second, build through a sequence of distinct techniques (typography, shape play, camera moves, colour shifts), and land on a clean, memorable final frame. Pacing should feel like it''s cut to music. Go crazy.'
  prompt_lang: en
  prompt_zh: 你是世界级的动效设计师，这是你的 15 秒简历作品集。要有动感、有自信：第一秒就用一个抓人的钩子开场，接着依次展示一系列不同的技法（字体排印、形状玩法、镜头运动、色彩变化），最后落在一个干净、令人难忘的结束画面上。节奏要像是卡着音乐剪出来的。放开了做。
  kind: brief
  inputs:
