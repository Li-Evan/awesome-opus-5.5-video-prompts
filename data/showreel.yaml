- id: gdgtify-929495
  title: 'Kinetic typography speech: Build the Floor'
  title_zh: 文字搭成平台的演讲短片
  url: https://x.com/Gdgtify/status/2103458245213929495
  author: Gdgtify
  author_name: Gadgetify
  platform: x
  date: '2026-09-25'
  description: A 20-second 1080×1080 kinetic-type film where a five-line speech's words become lintel, supports and platform, as a deterministic, seamlessly looping SVG/Canvas HTML.
  description_zh: 20 秒 1080×1080 动态文字短片，五句演讲的字变成门楣、支柱和平台，SVG/Canvas 单文件无缝循环。
  prompt: 'Create a 20.00-second kinetic spoken-word film titled “BUILD THE FLOOR.”  Treat this as an original miniature speech staged entirely through typography. Every line changes the architecture of the frame. The final declaration must stand on something the earlier words physically constructed.  Deliver one self-contained HTML file, 1080×1080, targeting 60fps, using SVG and/or Canvas. Embed all required assets.  ART DIRECTION Background #102820. Paper # F4E9D5. Structural accent # F2B544. A literary editorial world with the scale and confidence of a public monument. Use a high-contrast serif for the speech, a heavy grotesque for load-bearing words, and a restrained monospace for small timing marks. No distressed protest-poster clichés, megaphones, flags, crowds, microphones, or stock footage.  ORIGINAL SPEECH — EXACT WORDS, EXACT ORDER “We were told to wait.” “So we learned the weight of waiting.” “Then one voice made room.” “Then another.” “Now the floor belongs to us.”  Do not attribute these words to any real person. No extra slogans. The complete speech must be understandable without audio.  CENTRAL VISUAL RULE Words have assigned architectural roles. WAIT is a lintel. WAITING is a suspended load. VOICE is a support. ROOM is an opening. FLOOR is a platform. These roles must emerge from the actual letterforms, not from separate illustrations placed behind text.  STORYBOARD 0.00–3.00 “We were told to wait.” The sentence occupies a narrow horizontal opening beneath a massive WAIT. The opening slowly compresses while the sentence remains readable. The pressure comes from the layout, not camera shake.  3.00–6.50 “So we learned the weight of waiting.” Reveal the sentence in spoken phrase groups. WAITING lowers on two fine vertical rules. Those rules become suspension cables. A baseline bends under the visual load using a controlled vector deformation.  6.50–10.00 “Then one voice made room.” VOICE enters vertically and rotates into a structural support. It lifts one end of the baseline. The counter of the O in ROOM becomes an aperture. The next composition is revealed through that aperture.  10.00–12.50 “Then another.” A second support arrives. The tilted structure levels. This is the first moment of perfect horizontal alignment in the film. Use a brief stillness to make the change feel earned.  12.50–16.00 “Now the floor belongs to us.” Earlier structural words assemble into a platform. The final sentence settles onto it. US receives emphasis through shared alignment and scale, never through a separate flashy effect.  16.00–18.00 Hold the complete declaration. A slight release of tension travels through the supporting rules. No new text. No restless decorative motion.  18.00–20.00 The camera tracks beneath the completed platform. Its underside fills the frame and becomes the opening WAIT lintel. Under full occlusion, return hidden elements to their initial positions. Reveal the exact opening composition.  CHOREOGRAPHY Do not force the speech onto a dance beat. Use a cue sheet based on phrases, pauses, and emphasis. Phrase reveals should follow reading order. Allow at least one 400ms moment of absolute stillness. Use critically damped motion for settling loads. Use controlled elastic deformation for the baseline only. Make the changes in available space carry the emotional progression.  TYPE IMPLEMENTATION Use actual glyph paths for structural words. Preserve counters and legibility during deformation. For transitions between unrelated words, use occlusion or matched structural edges; do not interpolate arbitrary path points. Keep the currently spoken phrase readable before it becomes architecture.  ENGINEERING Implement window. seek(t) as a deterministic scene renderer. No accumulated physics, autonomous CSS transitions, or changing random values. Use time-remapping curves and analytic transforms. Use a 20-second periodic timeline with render(0)=render(20). Provide fixed-step access at n/60 for 1200 export frames. Audio is optional and off by default; no browser speech synthesis or autoplay dependency.  QUALITY GATE Inspect eight representative frames. Check that the speech reads in the correct order. Check that structural transformations never destroy a line before the audience can read it. Check the final platform is visibly assembled from earlier elements. Return the complete HTML implementation.'
  prompt_lang: en
  prompt_zh: |-
    制作一段 20.00 秒的动态口语短片，标题为 “BUILD THE FLOOR”。把它当作一段原创的微型演讲，完全用字体排印来演出。每一句都改变画面的结构。最后的宣言必须站在前面的文字实际搭建起来的东西上。交付一个自包含的 HTML 文件，1080×1080，目标 60fps，使用 SVG 和/或 Canvas。嵌入所有需要的素材。

    艺术指导：背景 #102820。纸色 # F4E9D5。结构强调色 # F2B544。一个文学编辑风格的世界，带着公共纪念碑的尺度和自信。演讲正文用高对比衬线体，承重的词用粗重的 grotesque 无衬线体，小的时间标记用克制的等宽字体。不要做旧的抗议海报套路、扩音器、旗帜、人群、麦克风或素材库画面。

    原创演讲——原词、原顺序：“We were told to wait.” “So we learned the weight of waiting.” “Then one voice made room.” “Then another.” “Now the floor belongs to us.” 不要把这些话归到任何真实人物名下。不加额外口号。整段演讲在没有声音时也必须能看懂。

    核心视觉规则：文字被分配了建筑角色。WAIT 是门楣。WAITING 是悬挂的重物。VOICE 是支柱。ROOM 是开口。FLOOR 是平台。这些角色必须从真实的字形里长出来，而不是在文字后面另放插图。

    故事板：
    0.00–3.00 “We were told to wait.” 这句话占据一个巨大 WAIT 下方的狭窄水平开口。开口慢慢收窄，而句子始终可读。压迫感来自版式，而不是镜头抖动。
    3.00–6.50 “So we learned the weight of waiting.” 按口语的短语分组显示这句话。WAITING 挂在两条细竖线上缓缓下降。这两条线变成吊索。一条基线在视觉重量下弯曲，用受控的矢量形变实现。
    6.50–10.00 “Then one voice made room.” VOICE 竖着进入，旋转成一根结构支柱。它抬起基线的一端。ROOM 中 O 的字怀变成一个孔洞。下一个构图通过这个孔洞揭示出来。
    10.00–12.50 “Then another.” 第二根支柱到来。倾斜的结构回到水平。这是全片第一次完全水平对齐。用短暂的静止让这个变化显得来之不易。
    12.50–16.00 “Now the floor belongs to us.” 之前的结构词拼成一个平台。最后一句落在平台上。US 通过共同的对齐和尺度得到强调，绝不用单独的花哨特效。
    16.00–18.00 完整的宣言停留。一丝张力的释放传过支撑线。不加新文字。不要躁动的装饰性动效。
    18.00–20.00 镜头在完成的平台下方跟移。平台底面充满画面，变成开头的 WAIT 门楣。在完全遮挡时，把隐藏的元素复位到初始位置。揭示出与开头完全一致的构图。

    编排：不要把演讲硬套在舞曲节拍上。按短语、停顿和重音做一张提示表。短语按阅读顺序出现。至少留一个 400ms 的绝对静止。沉降的重物用临界阻尼运动。受控的弹性形变只用于基线。让可用空间的变化承载情绪的推进。

    字体实现：结构词使用真实的字形路径。形变时保留字怀和可读性。不相关的词之间的转场用遮挡或对齐的结构边缘；不要随意插值路径点。当前说出的短语在变成建筑之前要保持可读。

    工程：把 window. seek(t) 实现为确定性的场景渲染器。不要累积的物理、自动运行的 CSS 过渡或变化的随机值。使用时间重映射曲线和解析变换。使用 20 秒的周期时间线，render(0)=render(20)。以 n/60 提供固定步长访问，共 1200 个导出帧。音频可选，默认关闭；不依赖浏览器语音合成或自动播放。

    质量关卡：检查八个有代表性的帧。检查演讲按正确顺序可读。检查结构变换绝不会在观众读完一句之前把它毁掉。检查最后的平台明显是由前面的元素拼成的。返回完整的 HTML 实现。
