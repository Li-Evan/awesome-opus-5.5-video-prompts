  description: A stylized real-time 3D scene of a pirate ship crossing a sunset ocean, with foam, wake and rigging, delivered as one HTML file the model tests itself.
  description_zh: 风格化的实时 3D 海盗船场景，夕阳、浪花、尾迹和索具俱全，单个 HTML 文件交付，要求模型自己进浏览器测试。
  prompt: 'Create from scratch a fully interactive 3D scene of a pirate ship sailing across a dynamic ocean at sunset. The visual style should be cinematic and stylized rather than photorealistic, while still being exceptionally rich, detailed, polished, and visually sophisticated. Build the ship, ocean, sky, lighting, materials, sails, rigging, cannons, small structural details, sea foam, wake, particles, animation, camera work, composition, atmospheric depth, and color grading. The final result should feel like a premium, high-production 3D artwork, not a prototype, technical demo, or low-quality scene. Start from a completely blank page. Do not reuse or depend on any previous project or scene. You may create the assets yourself or use reliable, trusted, open-source assets and libraries when necessary. Mandatory requirements: No text of any kind may appear anywhere inside the scene. No titles, names, logos, descriptions, credits, labels, or control instructions in any language. Deliver the entire project as one final standalone page file that can be opened directly in a web browser, with assets embedded inside it as much as reasonably possible. The ocean, ship, sails, and camera must all be animated naturally and smoothly. Avoid artificial slow motion or sluggish movement. The ship should feel like it is genuinely moving through the water. Do not rely on primitive geometric shapes as the finished result. Build a visually convincing and detailed pirate ship, including a carefully shaped hull, masts, sails, rigging, ropes, cannons, railings, lanterns, deck structures, and clearly visible small-scale details. Lighting must reveal the ship''s geometry and materials clearly. Create a rich sunset atmosphere, deep ocean shading, reflections, convincing sea foam, and a detailed sailing wake behind and around the vessel. Maintain a strong balance between visual quality and real-time performance, preserving smooth interaction and animation without making an obvious sacrifice in quality. Automatically use the most appropriate skills, tools, libraries, techniques, and available assets needed to achieve the best result. Do not wait for me to specify which technologies to use. Actually test the finished result in a desktop web browser. Capture visual screenshots, inspect the browser console for errors, and fix every visible or technical issue you find, including distorted geometry, black screens, failed asset loading, broken animation, poor composition, rendering artifacts, or camera problems. At the end, verify that the final file opens and works directly, that the scene contains no text whatsoever, and that there are no remaining runtime or loading errors. Then finish the task with only a brief response.'
  prompt_lang: en
  prompt_zh: 从零开始创建一个完全可交互的 3D 场景：一艘海盗船在日落时分驶过动态的海面。视觉风格要有电影感、风格化，而不是照片级写实，但仍然要极其丰富、细致、精致，视觉上足够讲究。船、海洋、天空、光照、材质、船帆、索具、火炮、细小的结构细节、海浪泡沫、尾迹、粒子、动画、运镜、构图、大气纵深和调色都要做出来。最终效果应该像一件高品质、高制作水准的 3D 艺术作品，而不是原型、技术演示或粗糙的场景。从一张完全空白的页面开始。不要复用或依赖任何之前的项目或场景。你可以自己制作素材，必要时也可以使用可靠、可信的开源素材和库。强制要求：场景中任何地方都不能出现任何文字。不要标题、名字、logo、说明、署名、标签，也不要任何语言的操作提示。整个项目以一个最终的独立页面文件交付，能直接在网页浏览器中打开，素材尽可能内嵌在文件里。海面、船、船帆和镜头都必须自然流畅地动起来。避免刻意的慢动作或拖沓的运动。船要让人感觉真的在水中前行。不要拿简单几何体当最终成品。做一艘视觉上可信、细节丰富的海盗船，包括精心塑形的船体、桅杆、船帆、索具、绳索、火炮、栏杆、灯笼、甲板结构，以及清晰可见的小尺度细节。光照必须把船的几何形状和材质清楚地展现出来。营造浓郁的日落氛围、深邃的海洋明暗、倒影、逼真的海浪泡沫，以及船身后方和四周细致的航行尾迹。在画面质量和实时性能之间保持好平衡，保证交互和动画流畅，又不明显牺牲质量。自动选用最合适的 skill、工具、库、技术和可用素材来达到最佳效果。不要等我指定用什么技术。真正在桌面网页浏览器里测试最终成果。截取画面截图，检查浏览器控制台里的错误，修复你发现的所有视觉或技术问题，包括几何变形、黑屏、素材加载失败、动画出错、构图不佳、渲染瑕疵或镜头问题。最后，确认最终文件能直接打开并正常运行，场景里完全没有文字，也没有残留的运行时或加载错误。然后只用简短的回复结束任务。
