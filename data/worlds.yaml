    它可以是一段视频，也可以是你能想到的任何别的东西。

    要有创意。放开了做。往深里挖。

    不要 AI 垃圾。要独特，跳出框框思考。往大处想。往惊艳处想。做一个其他模型从没做过的东西。

    要有骄傲感。拿出你最好的水平。别让我失望。
