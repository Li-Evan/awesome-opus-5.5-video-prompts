- id: yumaeriel-520903
  title: Brush-painted short film about hidden emotions
  title_zh: 油画笔触短片：藏不住的情绪
  url: https://x.com/yumaeriel/status/2102930737955520903
  author: yumaeriel
  author_name: Yumaeriel
  platform: x
  date: '2026-09-24'
  description: A 30-second p5.js short in rough frame-by-frame brushwork, matched to an attached reference video, following a dark figure whose inner orange light escapes.
  description_zh: 30 秒 p5.js 短片，逐帧粗笔触油画质感，严格对齐附带的参考视频；深蓝人影体内的橙色情绪之光逐渐溢出。
  prompt: 'Create a complete 30-second 2D animated short film in p5.js. The ATTACHED VIDEO is the strict visual reference. Do not reinterpret its visual style. Do not modernize it. Do not transform it into generative art, vector animation, abstract motion graphics, collage, watercolor, paper cutout, cyberpunk, neon graphics, particle art, or clean digital illustration. The objective is for the final animation to feel as if it belongs to the exact same animated world as the reference video. ABSOLUTE VISUAL PRIORITY The most important requirement is: EVERY FRAME MUST LOOK PAINTED FRAME-BY-FRAME WITH A ROUGH PHYSICAL BRUSH. The reference does NOT look like clean digital illustration. It looks like moving paint. Every surface must visibly contain brush strokes. The brush strokes must remain visible in: skies walls skin silhouettes floors shadows clouds clothing light flames landscapes Never cover the image with smooth digital gradients. Never create large perfectly flat computer-generated fills. The paint itself is part of the image. THE ACTUAL PAINTERLY LANGUAGE Reproduce the following characteristics extremely closely. BRUSHWORK Use hundreds of short, directional, overlapping brush strokes. The strokes should feel like they were made with: a dry bristle brush opaque paint rough digital gouache / oil-like paint visible pressure imperfect edges The painting is NOT delicate watercolor. The paint is relatively opaque and dense. Individual brush marks are clearly visible. Backgrounds should contain visible waves of short strokes following the form of the environment. For example: A night sky is not a smooth navy rectangle. It is constructed from many overlapping navy, ultramarine and violet strokes. A brown wall is not a flat brown surface. It contains hundreds of curved brown and ochre marks. A human silhouette is not a clean polygon. It consists of rough overlapping brush masses. BRUSH DIRECTION Brush direction is extremely important. Do not scatter texture randomly. The strokes must describe the shape. Sky: mostly broad horizontal or gently curved strokes. Walls: large irregular swirling strokes. Ground: horizontal scraped strokes. Human torso: strokes following shoulders, chest and spine. Arms: strokes following the direction of the limbs. Flames: vertical upward strokes. Light beams: long vertical cream / yellow / orange strokes. This gives the entire animation the sensation of a moving painting. TEMPORAL PAINT INSTABILITY The painting itself must subtly change over time. Do NOT freeze the texture. At approximately 12–15 visual frames per second, slightly alter: silhouette edges brush positions paint density small color patches highlight shapes shadow shapes The movement should feel like each frame has been repainted. This is essential. However: do NOT create ugly random jitter. The forms remain coherent. The PAINT changes. The OBJECT does not randomly teleport. Think: frame-by-frame painted animation. EXACT COLOR WORLD The entire film must stay inside an extremely restrained palette. DARKS deep navy blue almost-black indigo ultramarine dark desaturated violet extremely dark brown MIDTONES muddy earth brown burnt umber muted ochre dusty violet dark teal-blue LIGHT cream ivory warm pale yellow PRIMARY EMISSIVE COLOR amber gold burnt orange yellow-orange hot cream-white The dominant visual opposition is: DEEP BLUE / BROWN DARKNESS versus INCANDESCENT ORANGE-GOLD LIGHT Do not introduce green neon. Do not introduce magenta neon. Do not introduce cyan sci-fi lighting. Do not create a rainbow palette. LIGHT STYLE Light in the reference is powerful but still PAINTED. The light source may contain: cream-white core → pale yellow → golden yellow → orange → brown-orange halo But its boundary must never look like a perfect digital radial gradient. The edge should be broken. Uneven. Brushy. Fragments of paint should escape from the luminous area. Strong light may overexpose parts of a character into cream or yellow. Nearby surfaces may receive rough orange brush highlights. Use glow, but hide the digital perfection of the glow beneath irregular painted layers. THE LIGHT BEAM When using a beam of light, reproduce the exact visual logic of the reference: A thick, almost white-yellow painted center. Orange-yellow irregular edges. Small broken fragments around the contour. Slight temporal deformation. A soft warm halo surrounding it. The beam may bend abruptly rather than behaving like realistic light. It should look like a giant painted stroke of light entering the world. NOT: laser sci-fi energy volumetric 3D beam hologram HUMAN CHARACTERS Human characters must follow the same rendering logic as the reference. There are two important visual families. DARK HUMAN FIGURES Dark people are painted almost entirely in: navy indigo black-blue Their bodies are simplified but recognizably human. Edges are rough. Anatomy is suggested with large brush masses. Do not draw individual fingers unless necessary. Do not create clean facial features. Faces are mostly dark. When eyes are visible: use two tiny bright cream/white glowing dots. The eyes should create a slightly uncanny, poetic presence. Do NOT make giant cartoon eyes. LUMINOUS HUMAN FIGURES Some characters may become almost entirely orange-gold. Their bodies appear made from light and paint. Use: orange body mass yellow highlights cream highlights small luminous imperfections Parts of the body may disappear into light. Small glowing flecks may exist inside or around the silhouette. Again: do not make these flecks into a conventional particle system. They are tiny PAINT MARKS. CHARACTER EDGES Never use crisp anti-aliased vector edges. Edges should look created by repeated brush contact. Produce: tiny protrusions missing paint rough angular sections occasional duplicated edge strokes small warm rim lights Dark characters illuminated by orange light should receive a thin, irregular orange-painted rim. Not a clean outline. CHARACTER ANIMATION The body animation should feel naturally observed. Use believable human weight. Characters should: lean hesitate reach pull collapse turn bend look upward hold tension Do NOT animate characters as simple stick figures. Use a skeletal system internally if needed, but render over it with large deformable painted masses. The rig must remain invisible. The visible result should look hand-painted. For fast actions: allow individual painted frames to stretch. Use rough smear poses. A hand may become a long brush mark for 1–2 frames. An arm may momentarily distort. The animation must prioritize expressive movement over perfect anatomy. BACKGROUNDS Backgrounds must be simple in geometry but extremely rich in painted texture. Typical structures: large dark painted skies horizontal mountain bands brown cavern-like interiors flat theatrical floors dark voids simple walls simple windows large horizons Do not fill backgrounds with tiny realistic details. The reference creates richness using PAINT, not objects. A wall may contain only one brown color family but hundreds of directional brush marks. COMPOSITION Use graphic, readable compositions. Often: one strong horizontal line one central vertical light one clearly readable human silhouette large areas of darkness Do not overpopulate every frame. Allow negative space. The visual hierarchy must remain immediate. CAMERA Use mostly: static compositions slow push-ins slow pull-backs gentle pans small reframing movements Occasionally use one sudden motion for an emotional transition. Avoid constant 3D camera movement. Avoid orbit cameras. Avoid cinematic drone-like movement. The visual power comes from: paint composition light body language not virtual camera tricks. NO COMPUTER-GRAPHICS LOOK ABSOLUTELY FORBIDDEN: perfect vector paths clean SVG appearance perfect Bezier silhouettes perfect circles everywhere smooth Illustrator gradients slick motion-graphics easing everywhere 3D objects glossy reflections PBR materials neon cyberpunk holographic effects lens flare packs generic particle emitters glitter clouds starfield screensavers fractal visuals HUD interfaces corporate animation flat-design illustration paper collage cut-paper characters chalkboard aesthetic watercolor wash aesthetic anime cartoon character design The final result should look like animated PAINT. STORY THEME Human beings often try to hide their emotions. But emotions continue to move through us. The short film follows one dark-blue human figure whose inner emotional light gradually escapes from their body. No text. No narration. No labels such as: FEAR ANGER SADNESS Everything is communicated visually. 00:00–00:05 SOMETHING ARRIVES Deep navy painted night. Large horizontal fields of rough dark-blue brushwork. A tiny human figure stands alone near the bottom center. The character is painted dark indigo. Almost invisible. Only two tiny pale eyes are visible. Hold the composition. Then: from outside the frame, a gigantic cream-yellow-orange painted beam enters diagonally from above. It suddenly bends downward. Exactly like a massive brush stroke changing direction. It hits the ground several meters in front of the person. A violent warm light spreads across the painted ground. Small orange paint marks appear around the impact point. The person protects their face with one arm. The warm light creates a rough orange rim around their silhouette. Camera slowly approaches. Inside the impact point: something humanoid begins forming. 00:05–00:09 THE EMOTION TAKES A BODY The orange light rises. Inside the beam appears a glowing orange human figure. Its body is incomplete. Parts flicker between: orange paint yellow paint cream-white light The dark-blue person approaches. The orange person mirrors their posture. Dark human raises an arm. Orange human raises an arm. Dark human leans forward. Orange human leans forward. But with a slight delay. The dark human gradually realizes: this luminous figure is part of them. The beam disappears upward. The orange figure remains. 00:09–00:12 INSIDE Cut abruptly to an extreme close-up of the dark person''s back and torso. The background becomes dirty pale cream. Render the body with thick brown-orange and dark brush strokes. A thin vertical line of orange light appears along the spine. It travels downward. The surrounding painted muscles receive moving amber highlights. The light reaches the center of the torso. A brilliant orange-white glow appears. For a moment: the body seems transparent through paint. Inside are several tiny orange flame-like shapes. They are alive. Not realistic flames. Small painted emotional creatures. Some hide. Some tremble. Some jump. Some stare outward. Cut. 00:12–00:16 WE TRY TO CONTROL THEM Large brown painted room. Visible swirling brown brushwork covers the walls. A long pale painted platform crosses the image horizontally. Several dark navy human figures surround it. Their tiny white eyes are visible. Above the table: many small orange flame-like emotional forms float through the room. One person uses a long rough pole ending in a pale painted hoop. They attempt to catch one emotion. Another person reaches toward another. Another tries to push them away. The emotions move unpredictably. Some are tiny. Some suddenly grow. A giant orange emotion briefly enters from above. Everyone freezes. Then it rushes upward out of frame. This scene should feel strange, serious and slightly absurd. Exactly the tonal balance of the reference. 00:16–00:19 FEAR Night again. Simple theatrical landscape. Dark brown lower half. Deep blue-purple painted sky. A row of small cream-orange lights forms a horizontal border. The luminous orange human hangs slightly above the ground. Thin almost invisible lines appear attached above their shoulders and arms. The figure behaves as though being pulled by forces outside their control. A dark-blue person watches from the foreground. The orange human tries to walk. Their leg moves forward. The invisible line pulls them backward. They struggle. Their body flickers. Several tiny warm marks fall from their chest. One reaches the ground. It continues glowing. 00:19–00:22 ANGER Interior view. The dark person extends one arm forcefully. From the hand: not a laser. A thick orange-white painted streak explodes horizontally. The stroke consists of several overlapping rough brush marks. It moves across the image. As it passes: small orange flame-creatures appear. More. More. Too many. The room becomes brighter. The dark person''s orange rim becomes stronger. Their gesture initially appears powerful. Then the painted stroke begins bending back toward them. The emotion they released returns. The person''s posture changes from attack to surprise. Cut just before impact. 00:22–00:25 TRYING TO UNDERSTAND Top-down view. Brown painted desk. Several dirty cream sheets. The papers must still be PAINTED, not photorealistic paper textures. On them: rough black handwritten marks small arrows tiny red marks primitive diagrams human-like shapes Central page: a large irregular black circle. Several red arrows point toward the circle. The circle must look painted. Not geometrically perfect. A dark-blue painted hand enters. It touches the black center. The circle transforms into a dark opening. Camera enters the opening. 00:25–00:28 WE ARE NOT ALONE Transition into a deep teal-blue painted void. The orange human is suspended vertically in the center. Around them: many pale blue-white human bodies. All are painted using the same rough brush treatment. No clean outlines. Some curl inward. Some reach. Some fall. Some sit. Some appear exhausted. Some float. Very thin vertical lines extend upward from several figures. The composition feels like human beings suspended inside an enormous emotional space. The orange person reaches toward one white-blue person. A thin hand-painted orange arc connects their hands. A small orange point appears inside the other person''s chest. Then another connection. Then another. Warmth begins spreading between people. Not through particles. Through painted lines and glowing marks. 00:28–00:30 EMOTIONS MOVE BETWEEN US Very dark final landscape. Two small orange points exist far apart. Each belongs to a human silhouette. One orange point moves away from the first chest. It travels through darkness as one rough glowing brush mark. It enters the chest of the second person. Both silhouettes now have warm orange rims. The environment remains dark. No triumphant sunrise. No happy ending cliché. Only two humans. Two small lights. Large dark painted space. Hold for approximately one second. Cut to black. EMOTIONAL TONE The film should feel: mysterious human melancholic strange warm slightly unsettling intimate poetic Never sentimental. Never cute. Never epic superhero cinema. P5.JS RENDERING STRATEGY Do NOT solve the visual style by applying one texture overlay to normal vector graphics. The actual primitives themselves must look painted. Create a custom brush renderer. A brush stroke can be constructed from: an irregular center path multiple semi-opaque deposits varying width small edge fragments slight hue variation rough alpha mask Create reusable systems such as: PaintStroke PaintedShape PaintedHuman PaintedGlow PaintedFlame PaintedBackground PaintedLightBeam PAINTED BACKGROUND TECHNIQUE Instead of: background(20, 30, 70); construct the visible field from many strokes. For example conceptually: base dark fill 150–400 large brush marks using neighboring colors: navy dark violet ultramarine near-black blue Their opacity should overlap. Their direction should follow the environment. Do this for every major surface. HUMAN RENDERING TECHNIQUE Internally animate a skeleton. But render each limb as several irregular painted polygons / brush masses. A forearm should not be: line() or a perfect capsule. Build it from rough overlapping shapes. Slightly regenerate its contour on the handmade animation frame. Use the skeleton only as hidden construction. DUAL FRAME RATE Render the browser smoothly at approximately 60 FPS. But update the PAINTED DRAWING state around: 12 FPS or 15 FPS. For example: handPaintFrame = floor(time * 12) Use this state to control: brush contour variation paint marks small silhouette changes flame shape changes highlight irregularities Camera interpolation can remain smooth. This contrast is extremely important. GLOW Use digital blur internally if necessary. But always place irregular painted marks over and around it. A glow alone must never reveal a perfect Photoshop-like halo. Bright areas must contain visible paint structure. IMPORTANT FINAL CHECK Before accepting any scene, ask: “Could this frame plausibly be a frame from the attached reference animation?” If the answer is no: change it. If it looks like p5.js generative art: change it. If it looks like vector motion design: change it. If it looks like particles with bloom: change it. If it looks like watercolor: change it. If it looks like paper collage: change it. If it looks too clean: change it. If the brush strokes are not immediately visible: change it. FINAL TARGET The viewer should primarily perceive: PAINT MOVING. Not code. Not particles. Not vectors. Not shaders. Not procedural graphics. A dark, expressive animated painting made of rough brush strokes, deep blue silhouettes, brown and violet painted environments, uncanny tiny pale eyes, and violent warm orange light. The attached video is the authority for: palette brush density edge roughness character rendering light behavior background rendering contrast composition movement visual rhythm Match that visual language as closely as possible throughout the full 30 seconds.'
  prompt_lang: en
  prompt_zh: |-
    用 p5.js 制作一部完整的 30 秒 2D 动画短片。附带的视频（ATTACHED VIDEO）是严格的视觉参考。不要重新诠释它的视觉风格。不要把它现代化。不要把它变成生成艺术、矢量动画、抽象动态图形、拼贴、水彩、剪纸、赛博朋克、霓虹图形、粒子艺术或干净的数字插画。目标是让最终的动画感觉就像和参考视频属于完全同一个动画世界。

    视觉绝对优先项
    最重要的要求是：每一帧都必须看起来像是用粗糙的实体画笔逐帧画出来的。参考视频看起来并不像干净的数字插画，它看起来像流动的颜料。每个表面都必须看得见笔触。笔触必须在这些地方保持可见：天空、墙面、皮肤、剪影、地面、阴影、云、衣服、光、火焰、风景。绝不要用平滑的数字渐变覆盖画面。绝不要生成大面积完全平整的电脑填色。颜料本身就是画面的一部分。

    真正的绘画语言
    极其贴近地复现以下特征。
    笔触
    使用成百上千道短促、有方向、相互叠压的笔触。笔触应该让人感觉是用这些画出来的：干硬的鬃毛笔、不透明颜料、粗糙的数字水粉 / 类油画颜料、看得见的压感、不完美的边缘。这幅画不是精致的水彩。颜料相对不透明、厚重。每一道笔痕都清晰可见。背景里应该有顺着环境形体走的、一波波可见的短笔触。例如：夜空不是一块平滑的藏青色矩形，而是由许多层叠的藏青、群青和紫罗兰色笔触构成。一面棕色的墙不是一块平坦的棕色，而是包含成百上千道弯曲的棕色和赭色笔痕。人的剪影不是一个干净的多边形，而是由粗糙、叠压的笔触色块组成。

    笔触方向
    笔触方向极其重要。不要随机撒纹理。笔触必须描绘出形体。天空：以宽阔的水平或轻微弯曲的笔触为主。墙面：大块不规则的旋涡状笔触。地面：水平的刮擦笔触。人的躯干：笔触顺着肩膀、胸口和脊柱走。手臂：笔触顺着肢体的方向。火焰：竖直向上的笔触。光束：长长的竖向奶油色 / 黄色 / 橙色笔触。这会让整部动画有一种会动的油画的感觉。

    颜料的时间不稳定性
    画面本身必须随时间细微变化。不要把纹理冻住。以大约每秒 12–15 个视觉帧的节奏，轻微改变：剪影边缘、笔触位置、颜料密度、小色块、高光形状、阴影形状。运动应该让人觉得每一帧都被重新画过。这一点至关重要。但是：不要做出难看的随机抖动。形体保持连贯。变的是颜料。物体不会随机瞬移。想想：逐帧手绘动画。

    精确的色彩世界
    整部片子必须限定在一套极其克制的调色板里。
    暗部：深藏青蓝、近乎黑色的靛蓝、群青、暗而低饱和的紫罗兰、极深的棕色
    中间调：泥土棕、熟褐、暗淡的赭黄、灰紫、暗青蓝
    亮部：奶油色、象牙白、暖浅黄
    主发光色：琥珀色、金色、焦橙色、黄橙色、炽热的奶油白
    主导的视觉对立是：深蓝 / 棕色的黑暗 对 炽热的橙金色光。不要引入绿色霓虹。不要引入洋红霓虹。不要引入青色科幻光。不要做成彩虹色板。

    光的风格
    参考视频里的光很强，但依然是画出来的。光源可以包含：奶油白的核心 → 浅黄 → 金黄 → 橙色 → 棕橙色光晕。但它的边界绝不能看起来像一个完美的数字径向渐变。边缘应该是破碎的、不均匀的、带笔触的。应该有颜料碎片从发光区域里逸散出来。强光可以把角色的局部过曝成奶油色或黄色。附近的表面可以受到粗糙的橙色笔触高光。可以用辉光，但要把辉光的数字化完美感藏在不规则的颜料层下面。

    光束
    使用光束时，要复现参考视频完全一致的视觉逻辑：粗厚、近乎白黄色的绘制中心。橙黄色的不规则边缘。轮廓周围细小的破碎碎片。轻微的随时间变形。环绕它的一圈柔和暖光晕。光束可以突然弯折，而不是像真实的光那样表现。它应该看起来像一道巨大的、画出来的光之笔触闯入这个世界。不要：激光、科幻能量、体积 3D 光束、全息投影

    人物角色
    人物必须遵循和参考视频相同的渲染逻辑。有两个重要的视觉类别。
    暗色人物
    暗色人物几乎全部用这些颜色画：藏青、靛蓝、黑蓝。他们的身体经过简化，但一眼能认出是人。边缘粗糙。用大块笔触暗示解剖结构。除非必要，不要画出单独的手指。不要画干净的五官。脸大多是暗的。当眼睛可见时：用两个极小的、明亮的奶油色 / 白色发光点。眼睛要营造一种略带诡异、富有诗意的存在感。不要画巨大的卡通眼睛。
    发光人物
    有些角色可以几乎整个变成橙金色。他们的身体看起来由光和颜料构成。使用：橙色的身体色块、黄色高光、奶油色高光、细小的发光瑕疵。身体的局部可以消融进光里。剪影内部或周围可以有细小的发光斑点。再说一次：不要把这些斑点做成常规的粒子系统。它们是细小的颜料痕迹。

    角色边缘
    绝不要用锐利、抗锯齿的矢量边缘。边缘应该看起来是画笔反复接触形成的。要做出：细小的凸起、缺失的颜料、粗糙的棱角段落、偶尔重复的边缘笔触、细小的暖色轮廓光。被橙色光照亮的暗色角色应该带一圈细细的、不规则的、画出来的橙色边缘。不是一条干净的描边。

    角色动画
    身体动画应该让人觉得是真实观察来的。使用可信的人体重量感。角色应该会：倾身、犹豫、伸手、拉拽、瘫倒、转身、弯腰、抬头仰望、保持紧绷。不要把角色做成简单的火柴人动画。需要的话内部可以用骨骼系统，但要在上面用大块可变形的颜料色块来渲染。骨骼绑定必须保持不可见。看得见的结果应该像手绘的。对于快速动作：允许个别画出的帧被拉伸。使用粗糙的拖影（smear）姿势。一只手可以在 1–2 帧里变成一道长长的笔痕。一条手臂可以短暂变形。动画必须把富有表现力的动作放在完美的解剖结构之前。

    背景
    背景的几何必须简单，但绘画肌理要极其丰富。典型结构：大片暗色的画出来的天空、水平的山脉带、棕色的洞穴般的室内、平坦的舞台式地面、黑暗的虚空、简单的墙、简单的窗、宽阔的地平线。不要用细小的写实细节填满背景。参考视频用颜料而不是物体来营造丰富感。一面墙可以只有一个棕色色系，却有成百上千道有方向的笔痕。

    构图
    使用图形感强、易读的构图。常见的是：一条有力的水平线、一道居中的竖直光、一个清晰可读的人物剪影、大面积的黑暗。不要把每一帧都塞满。允许留白。视觉层级必须一眼可辨。

    镜头
    主要使用：静态构图、缓慢推近、缓慢拉远、轻柔的横摇、小幅的重新构图。偶尔用一次突然的运动做情绪转场。避免持续的 3D 镜头运动。避免环绕镜头。避免电影式的无人机航拍运动。视觉力量来自：颜料、构图、光、肢体语言，而不是虚拟镜头的花招。

    不要电脑图形感
    绝对禁止：完美的矢量路径、干净的 SVG 观感、完美的贝塞尔剪影、到处都是完美的圆、平滑的 Illustrator 渐变、到处都是圆滑的动态图形缓动、3D 物体、光滑反射、PBR 材质、霓虹赛博朋克、全息效果、镜头光晕素材包、通用粒子发射器、闪粉云、星空屏保、分形视觉、HUD 界面、企业宣传动画、扁平化插画、纸拼贴、剪纸角色、黑板风格、水彩晕染风格、动漫卡通角色设计。最终结果应该看起来像会动的颜料。

    故事主题
    人们常常试图隐藏自己的情绪。但情绪仍在我们体内流动。这部短片跟随一个深蓝色的人物，其内在的情绪之光逐渐从身体里逸出。不要文字。不要旁白。不要这样的标签：FEAR、ANGER、SADNESS。一切都通过画面传达。

    00:00–00:05 有什么降临了
    深藏青色的、画出来的夜。大片水平铺开的粗糙深蓝笔触。一个很小的人独自站在画面底部中央附近。这个角色用暗靛蓝色画成，几乎看不见。只有两只极小的浅色眼睛可见。保持这个构图。然后：从画外，一道巨大的奶油黄橙色的绘制光束从上方斜着射入。它突然向下弯折，就像一道巨大的笔触改变了方向。它击中这个人前方几米处的地面。一股猛烈的暖光在画出来的地面上扩散开。撞击点周围出现细小的橙色颜料痕迹。这个人用一只手臂护住脸。暖光在他的剪影周围形成一圈粗糙的橙色轮廓。镜头缓缓靠近。在撞击点内部：某个人形的东西开始成形。

    00:05–00:09 情绪有了身体
    橙色的光升起。光束里出现一个发光的橙色人形。它的身体并不完整。局部在这几者之间闪烁：橙色颜料、黄色颜料、奶油白的光。深蓝色的人走近。橙色的人模仿他的姿势。暗色的人抬起一只手臂，橙色的人也抬起一只手臂。暗色的人向前倾身，橙色的人也向前倾身。但有轻微的延迟。暗色的人渐渐意识到：这个发光的身影是他自己的一部分。光束向上消失。橙色身影留了下来。

    00:09–00:12 内部
    突然切到暗色人物背部和躯干的大特写。背景变成脏脏的浅奶油色。用厚重的棕橙色和暗色笔触画出身体。一条细细的竖直橙色光线沿着脊柱出现，向下移动。周围画出来的肌肉受到移动的琥珀色高光。光到达躯干中央。出现一团耀眼的橙白色光芒。有那么一瞬间：身体仿佛透过颜料变得透明。里面有几个很小的、火苗般的橙色形状。它们是活的。不是写实的火焰，是画出来的小小情绪生物。有的躲藏，有的发抖，有的跳动，有的向外凝视。切。

    00:12–00:16 我们试图控制它们
    一间画出来的大棕色房间。墙上布满可见的棕色旋涡笔触。一张长长的浅色绘制平台横贯画面。几个暗藏青色的人围着它。他们的小白眼睛可见。桌子上方：许多火苗般的橙色小情绪体在房间里飘浮。一个人拿着一根粗糙的长杆，杆头是一个画出来的浅色圆环。他试图抓住一个情绪。另一个人伸手去够另一个。还有一个人想把它们推开。情绪的移动无法预测。有的很小，有的突然变大。一个巨大的橙色情绪短暂地从上方闯入。所有人都僵住了。然后它向上冲出画面。这一场应该让人觉得奇怪、严肃又有点荒诞。正是参考视频的那种基调平衡。

    00:16–00:19 恐惧
    又是夜晚。简单的舞台式风景。下半部分是深棕色。深蓝紫色的绘制天空。一排奶油橙色的小灯形成一道水平边界。发光的橙色人悬在离地面稍高的地方。细得几乎看不见的线出现在他的肩膀和手臂上方，系在身上。这个身影的表现就像被自己控制不了的力量拉扯着。一个深蓝色的人在前景里看着。橙色的人试图往前走。他的腿向前迈，看不见的线把他往后拉。他挣扎着。身体在闪烁。几个细小的暖色痕迹从他胸口掉落。有一个落到地上，继续发着光。

    00:19–00:22 愤怒
    室内视角。暗色的人用力伸出一只手臂。从手中射出的：不是激光。一道粗厚的橙白色绘制条纹水平炸开。这道笔触由好几道叠压的粗糙笔痕组成。它横穿画面。它经过的地方：出现橙色的小火苗生物。更多。更多。太多了。房间变亮。暗色人物的橙色轮廓变得更强。他的手势起初显得很有力量。然后那道绘制的笔触开始弯回朝向他。他释放出去的情绪回来了。这个人的姿态从攻击变成惊讶。在撞上之前切掉。

    00:22–00:25 试着去理解
    俯视视角。画出来的棕色书桌。几张脏脏的奶油色纸。这些纸也必须是画出来的，不要照片级的纸张纹理。纸上有：粗糙的黑色手写痕迹、小箭头、细小的红色记号、简陋的示意图、类似人形的图案。中间那页：一个大大的不规则黑圈。几支红色箭头指向这个圈。这个圈必须看起来是画的，不是几何上完美的圆。一只画出来的深蓝色的手伸进画面，触碰黑色的中心。圆圈变成一个黑暗的开口。镜头进入这个开口。

    00:25–00:28 我们并不孤单
    转场进入一片深青蓝色的绘制虚空。橙色的人竖直悬浮在中央。他周围：许多浅蓝白色的人体。全部用同样粗糙的笔触处理。没有干净的轮廓线。有的蜷缩，有的伸手，有的坠落，有的坐着，有的显得筋疲力尽，有的飘浮。几个人身上有非常细的竖线向上延伸。这个构图让人感觉人们悬浮在一个巨大的情绪空间里。橙色的人伸手去够一个白蓝色的人。一道细细的手绘橙色弧线连接起他们的手。另一个人的胸口里出现一个小小的橙色光点。然后又一次连接。又一次。温暖开始在人与人之间蔓延。不是通过粒子，而是通过画出来的线条和发光的痕迹。

    00:28–00:30 情绪在我们之间流动
    非常暗的最终风景。两个小小的橙色光点相隔很远，各自属于一个人的剪影。一个橙色光点离开第一个人的胸口，化作一道粗糙的发光笔痕穿过黑暗，进入第二个人的胸口。现在两个剪影都有了温暖的橙色轮廓。环境依然黑暗。没有胜利的日出。没有大团圆的俗套。只有两个人。两点小小的光。大片画出来的黑暗空间。停留大约一秒。切黑。

    情绪基调
    这部片子应该让人感觉：神秘、有人味、忧郁、奇异、温暖、略带不安、亲密、有诗意。绝不煽情。绝不可爱。绝不是史诗超级英雄电影。

    P5.JS 渲染策略
    不要靠在普通矢量图形上叠一层纹理来解决视觉风格。基本图元本身就必须看起来是画出来的。写一个自定义的笔刷渲染器。一道笔触可以由这些构成：不规则的中心路径、多次半透明的颜料堆积、变化的宽度、细小的边缘碎片、轻微的色相变化、粗糙的 alpha 遮罩。创建可复用的系统，例如：PaintStroke、PaintedShape、PaintedHuman、PaintedGlow、PaintedFlame、PaintedBackground、PaintedLightBeam

    绘制背景的技法
    不要用：background(20, 30, 70); 而是用许多笔触构建出可见的画面区域。概念上举个例子：一层暗色底色填充，再加 150–400 道大笔触，使用相邻的颜色：藏青、暗紫罗兰、群青、近黑的蓝。它们的不透明度要相互叠加。它们的方向要顺着环境走。每一个主要表面都这样做。

    人物渲染技法
    在内部驱动一副骨骼做动画。但把每条肢体渲染成几个不规则的绘制多边形 / 笔触色块。前臂不应该是：line() 或一个完美的胶囊体。用粗糙、叠压的形状来搭它。在每个手绘动画帧上轻微地重新生成它的轮廓。骨骼只作为隐藏的结构使用。

    双帧率
    浏览器以大约 60 FPS 流畅渲染。但绘画状态的更新频率大约为：12 FPS 或 15 FPS。例如：handPaintFrame = floor(time * 12) 用这个状态来控制：笔触轮廓的变化、颜料痕迹、剪影的细小变化、火焰形状的变化、高光的不规则。镜头插值可以保持平滑。这种反差极其重要。

    辉光
    必要时内部可以用数字模糊。但一定要在它上面和周围放上不规则的颜料痕迹。辉光单独出现时，绝不能露出一个 Photoshop 式的完美光晕。亮部必须包含可见的颜料结构。

    重要的最终检查
    在接受任何一场戏之前，先问：“这一帧有没有可能是附带参考动画里的一帧？”如果答案是否定的：改。如果它看起来像 p5.js 生成艺术：改。如果它看起来像矢量动效设计：改。如果它看起来像带泛光的粒子：改。如果它看起来像水彩：改。如果它看起来像纸拼贴：改。如果它看起来太干净：改。如果笔触不能一眼看出来：改。

    最终目标
    观众首先感知到的应该是：颜料在动。不是代码。不是粒子。不是矢量。不是着色器。不是程序化图形。一幅黑暗、富有表现力的动画绘画，由粗糙的笔触、深蓝色的剪影、棕色和紫罗兰色的绘制环境、诡异的细小浅色眼睛，以及猛烈的暖橙色光组成。在以下方面，以附带的视频为准：调色板、笔触密度、边缘粗糙度、角色渲染、光的表现、背景渲染、对比、构图、运动、视觉节奏。在完整的 30 秒里，尽可能贴近地匹配这种视觉语言。
