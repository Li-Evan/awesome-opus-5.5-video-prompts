- id: axtonliu-932956
  title: Talking-head clip turned into line-art explainer
  title_zh: 真人口播改线稿动画
  url: https://x.com/AxtonLiu/status/2102827887732932956
  author: AxtonLiu
  author_name: Axton
  platform: x
  date: '2026-09-23'
  description: An 83-second vertical talking-head video rebuilt with line-art animated B-roll and the speaker in a round picture-in-picture; Opus drew every frame in Python, audio and subtitles untouched.
  description_zh: 83 秒竖屏口播改成线稿动画 B-roll，真人缩到右下角圆形画中画；线稿由 Opus 用 Python 逐帧画出。
  prompt: |-
    把 short-1.mp4 做成一条新的竖屏短片 short-1-v5.mp4：

    1. 我的人像缩小成右下角的圆形画中画，能看清我在讲话，不遮字幕。
    2. 主画面换成一段动画 B-roll，跟着我讲的内容走：我说到哪个概念，画面就画哪个概念。风格轻松有趣，线稿动画就可以，不要写实。
    3. 原声、原字幕、时长都不变。
  prompt_lang: zh
  prompt_en: |-
    Turn short-1.mp4 into a new vertical short, short-1-v5.mp4:

    1. Shrink my portrait into a round picture-in-picture in the bottom-right corner, where you can see me talking, without covering the subtitles.
    2. Replace the main frame with animated B-roll that follows what I say: whatever concept I am talking about, draw that concept. Keep the style light and fun; line-art animation is fine, nothing realistic.
    3. Keep the original audio, original subtitles and length unchanged.
  kind: brief
  tools:
  - claude-code
  - python
  inputs:
  - footage
  effort: high
  note: 'Author: 28 min 53 s, with zero manual interventions.'
  note_zh: 作者称用时 28 分 53 秒，全程没有人工介入。
