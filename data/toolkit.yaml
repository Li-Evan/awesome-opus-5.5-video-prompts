# Director's toolkit: the original, hand-written part of this list.
# Rendered into README (summary), guide/director-toolkit.md (full) and the site.

quickstart:
  title: Quick Start
  title_zh: 三分钟上手
  intro: >-
    Opus 5.5 does not output video. It writes code that draws every frame (HTML Canvas, SVG, Three.js, Remotion,
    HyperFrames, Manim), renders the frames in a headless browser and stitches them into an MP4 with ffmpeg.
    That is why it is great at motion graphics, explainers and launch films, and why a change is a one-line edit
    and a re-render instead of a new roll of the dice.
  intro_zh: >-
    Opus 5.5 本身不输出视频。它写代码画出每一帧（HTML Canvas、SVG、Three.js、Remotion、HyperFrames、Manim），
    在无头浏览器里逐帧渲染，再用 ffmpeg 合成 MP4。所以它擅长动效、科普讲解和发布片；想改哪里，是改一行代码重新渲染，
    而不是重新抽卡。
  steps:
    - en: Open Claude Code (or the Claude app) with Opus 5.5 and set effort to high or max.
      zh: 打开 Claude Code（或 Claude App），模型选 Opus 5.5，effort 调到 high 或 max。
    - en: "Give it a renderer so it can produce a real MP4: `npx skills add heygen-com/hyperframes` or `npx skills add remotion-dev/skills`. You need Node 22+, Chrome and ffmpeg."
      zh: "装一个渲染器，让它能直接出 MP4：`npx skills add heygen-com/hyperframes` 或 `npx skills add remotion-dev/skills`。本机需要 Node 22+、Chrome 和 ffmpeg。"
    - en: Start in an empty folder, paste a prompt from this list, and swap in your own subject, brand and assets.
      zh: 新建一个空文件夹，从本列表挑一条提示词粘进去，把主题、品牌和素材换成你自己的。
    - en: Ask for one still frame per scene before the full render, then give notes like a director (see the vocabulary below).
      zh: 正式渲染前，先让它每个场景出一张静帧；确认后再像导演一样给修改意见（见下方导演词汇表）。

workflow:
  title: The Six-Step Director Workflow
  title_zh: 六步导演法
  credit: Adapted from a thread by @rexan_wong, who reverse-engineered dozens of "one prompt" videos.
  credit_zh: 改写自 @rexan_wong 的串推。他逆向拆解了一批号称「一句 prompt」的爆款视频。
  credit_url: https://x.com/rexan_wong/status/2103707054108299437
  steps:
    - title: Pick a reference
      title_zh: 选参考片
      en: Choose one or two videos whose pacing and type you want and tell Opus to match them. Naming a style beats describing one. Without a reference it falls back to centered text on a gradient with everything fading in.
      zh: 挑一两条你想要的节奏和字体风格的视频，让 Opus 照着做。点名一种风格，比描述一种风格好用得多。没有参考，它会退回默认样子：居中文字、渐变背景、所有东西淡入。
    - title: Install a renderer
      title_zh: 装渲染器
      en: HyperFrames or Remotion lets it write each scene as code and render straight to MP4. Every frame is exact, and a change edits one line instead of starting over.
      zh: 装 HyperFrames 或 Remotion，它就能把每个场景写成代码、直接渲染成 MP4。每一帧都是确定的，改一处只动一行，不用推倒重来。
    - title: Use real parts
      title_zh: 用真素材
      en: Give it your real screenshots, logo and UI components instead of letting it invent buttons and cards. Invented UI is where a video starts to look cheap.
      zh: 给它你的真实截图、Logo 和界面组件，别让它自己编按钮和卡片。编出来的界面，是视频看起来廉价的开始。
    - title: Dump all the context, ask for three storyboards
      title_zh: 一次给足上下文，要三版分镜
      en: Brand, colors, fonts, screenshots, the reference and a quick braindump of the video you see. Three storyboard variants let you choose a direction instead of polishing its first idea.
      zh: 品牌、配色、字体、截图、参考片，再口述一遍你脑子里的片子。要三版分镜，你是在挑方向，而不是去修它的第一个想法。
    - title: Approve stills before motion
      title_zh: 先审静帧，再动起来
      en: Ask for one still per scene. Fixing a storyboard takes seconds; fixing a finished render means re-rendering.
      zh: 每个场景先出一张静帧。改分镜只要几秒，改成片就得重新渲染。
    - title: Give notes like a director
      title_zh: 像导演一样给意见
      en: The first render is usually most of the way there. "Make it better" gets random changes; camera words get exactly the change you want.
      zh: 第一版通常已经完成了大半。「再好一点」只会换来随机改动，用镜头语言才能精确改到你想要的地方。

anatomy:
  title: Anatomy of a Pro Prompt
  title_zh: 一条专业提示词的结构
  credit: Structure from the open template shared by @twoclipping, the most saved prompt in this list (19k+ bookmarks).
  credit_zh: 结构来自 @twoclipping 公开的模板，它是本列表收藏最多的一条提示词（1.9 万+ 收藏）。
  credit_url: https://x.com/twoclipping/status/2103273003555402193
  parts:
    - tag: "<inputs>"
      en: What Opus should ask you for before it starts, such as brand name, 8 to 12 photos or UI states, and a royalty-free track around 120 BPM.
      zh: 开工前它要向你要的东西，比如品牌名、8–12 张照片或界面状态、一首 120 BPM 左右的免版权音乐。
    - tag: "<direction>"
      en: The look in one paragraph, plus a banned list (crossfades, glows, particles, holds over one second, anything that looks like a template). The banned list does more work than the style words.
      zh: 一段话写清画风，再加一份禁用清单（淡入淡出、发光、粒子、停留超过一秒、任何像模板的东西）。禁用清单比风格形容词更管用。
    - tag: "<structure>"
      en: A beat grid and a scene chain, for example "120 BPM, 54 beats, something happens on every beat", with each scene growing out of the previous one.
      zh: 节拍网格加场景链，比如「120 BPM，54 拍，每一拍都有事发生」，每个场景从上一个场景里长出来。
    - tag: "<build>"
      en: Engineering rules that make it renderable, such as one HTML file, every value computed from time inside seek(t), closed-form springs, beat analysis, and subframe motion blur.
      zh: 让它能稳定渲染的工程约束，比如单个 HTML 文件、所有数值都由 seek(t) 里的时间算出、闭式弹簧动画、先分析节拍、子帧运动模糊。
    - tag: "<gotchas>"
      en: Known failure modes to avoid, such as blurry text under a scaled camera, overlapping text swaps, and loops that stutter on the last frame.
      zh: 已知的翻车点，比如镜头缩放后文字发糊、文字切换重叠、循环首尾接不上。
    - tag: "<start>"
      en: What to do first, usually "ask me for the inputs, then show me the plan before writing code".
      zh: 第一步做什么，通常是「先问我要素材，写代码前先给我看计划」。

vocabulary:
  title: Director's Vocabulary
  title_zh: 导演词汇表
  intro: Say these instead of "make it better". Each one maps to a concrete change Opus can make in code.
  intro_zh: 别再说「再好一点」，换成这些词。每一个都对应 Opus 能在代码里做出的具体改动。
  terms:
    - term: push in
      want: Emphasize one element
      want_zh: 强调某个元素
      say: Push in on the button over 0.8s.
      say_zh: 镜头往按钮推近，用 0.8 秒。
    - term: pull out
      want: Reveal the whole picture
      want_zh: 揭示全貌
      say: Start tight on the chart, then pull out to the full page.
      say_zh: 从图表局部开始，拉远到整页。
    - term: hard cut on the beat
      want: Scene changes that hit the music
      want_zh: 换场卡在节拍上
      say: Hard cut here, landing on beat 17.
      say_zh: 这里硬切，落在第 17 拍。
    - term: match cut / morph
      want: Scenes that flow into each other
      want_zh: 场景之间连贯
      say: The circle in this shot becomes the logo in the next one.
      say_zh: 上一镜的圆直接变成下一镜的 logo。
    - term: one continuous take
      want: No slideshow feeling
      want_zh: 去掉幻灯片感
      say: Never cut. Every scene is built out of the previous one.
      say_zh: 全程不切镜，每个场景都从上一个场景里长出来。
    - term: hold
      want: Give people time to read
      want_zh: 让人读完字
      say: Hold this line for 1.5s before it moves.
      say_zh: 这句话停 1.5 秒再走。
    - term: slow to 0.7x
      want: Calm down a frantic cut
      want_zh: 太快太躁
      say: Slow every zoom to 0.7x.
      say_zh: 所有缩放放慢到 0.7 倍。
    - term: stagger
      want: Stop elements popping in all at once
      want_zh: 元素一起蹦出来太乱
      say: Bring the cards in one by one, 80ms apart.
      say_zh: 卡片依次进场，间隔 80 毫秒。
    - term: ease-out / spring
      want: Less mechanical motion
      want_zh: 动作太机械
      say: Use a spring with a tiny overshoot, no bouncy easing.
      say_zh: 改成弹簧动画，只带一点点回弹，不要弹跳缓动。
    - term: parallax
      want: Add depth to a flat frame
      want_zh: 画面太平
      say: Move the foreground faster than the background.
      say_zh: 前景比背景移动得快。
    - term: rack focus / depth of field
      want: Make the focal point obvious
      want_zh: 焦点不清
      say: Blur the background and keep only the product sharp.
      say_zh: 背景虚化，只留产品清晰。
    - term: mask reveal
      want: Classy text entrances
      want_zh: 更高级的文字出场
      say: Text rises out of a mask line instead of fading in.
      say_zh: 文字从一条遮罩线里升起来，而不是淡入。
    - term: kinetic typography
      want: Words that carry the rhythm
      want_zh: 让文字本身带节奏
      say: Animate the voiceover word by word, locked to the waveform.
      say_zh: 旁白逐词出现，和音频波形对齐。
    - term: whip pan
      want: Energetic transition
      want_zh: 有冲劲的转场
      say: Whip pan left into the next scene with motion blur.
      say_zh: 带运动模糊快速横甩到下一个场景。
    - term: speed ramp
      want: Make a key moment land
      want_zh: 让关键瞬间更有力
      say: Ramp down to 0.3x right before the drop, then snap back.
      say_zh: 高潮前降到 0.3 倍速，然后猛地恢复。
    - term: screen-studio zoom
      want: Product demos that follow the action
      want_zh: 产品演示跟着操作走
      say: Zoom to fill the frame wherever the cursor clicks; scale the cursor with it.
      say_zh: 光标点到哪里镜头就推到哪里铺满画面，光标跟着一起放大。
    - term: seamless loop
      want: A clip that can loop on a landing page
      want_zh: 能在官网循环播放
      say: Make the last frame identical to the first, cursor position and speed included.
      say_zh: 最后一帧和第一帧完全一致，光标位置和速度也要一致。
    - term: beat grid
      want: Everything in sync with the music
      want_zh: 所有动作和音乐同步
      say: Analyze the song for beats first and put one change on every beat.
      say_zh: 先分析歌曲节拍，每一拍安排一个变化。

checklist:
  title: The "One-Shot Slop" Checklist
  title_zh: 一句话默认病体检表
  credit: The seven symptoms are from @DavidKPiano; the fixes are ours.
  credit_zh: 七个症状来自 @DavidKPiano，对应的改法是本列表整理的。
  credit_url: https://x.com/DavidKPiano/status/2103919227853783445
  intro: Score your first render against these before you ask for changes.
  intro_zh: 拿到第一版成片后，先对照这张表体检，再提修改意见。
  items:
    - en: Pacing is far too fast.
      zh: 节奏太快。
      fix: Slow every move to 0.7x and hold key text for at least a second.
      fix_zh: 所有运动放慢到 0.7 倍，关键文字至少停留 1 秒。
    - en: Too many effects.
      zh: 特效太多。
      fix: Add a banned list (glows, particles, crossfades, gradients) to the prompt.
      fix_zh: 在提示词里加禁用清单（发光、粒子、淡入淡出、渐变）。
    - en: No cohesion, with movement in every direction.
      zh: 没有整体感，东西往各个方向乱动。
      fix: Pick one axis of motion per scene, or ask for one continuous take.
      fix_zh: 每个场景只保留一个运动方向，或者要求一镜到底。
    - en: No focal point.
      zh: 没有视觉焦点。
      fix: Name the one thing each scene is about and push in on it.
      fix_zh: 说清每个场景只讲一件事，然后推近它。
    - en: The same generic easing everywhere.
      zh: 缓动千篇一律。
      fix: Ask for springs with a tiny overshoot, and vary timing between elements.
      fix_zh: 改用轻微回弹的弹簧动画，不同元素用不同节奏。
    - en: No choreography.
      zh: 没有编排。
      fix: Give it a beat grid and assign one change to each beat.
      fix_zh: 给它一张节拍网格，每一拍只安排一个变化。
    - en: Motion without meaning.
      zh: 为动而动。
      fix: Tell it what each motion should explain, such as "the bar grows to show revenue doubling".
      fix_zh: 告诉它每个动作要说明什么，比如「柱子变高，表示收入翻倍」。
