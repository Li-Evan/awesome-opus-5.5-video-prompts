- id: petergostev-340234
  title: Rick Astley's dance in painted brushstrokes
  title_zh: 笔触画的 Rick Astley
  url: https://x.com/petergostev/status/2103082371570340234
  author: petergostev
  author_name: Peter Gostev
  platform: x
  date: '2026-09-24'
  description: A one-minute HTML animation of Rick Astley's dance in bold moving brushstrokes, synced to music also written in code; the source is on GitHub.
  description_zh: 约 1 分钟的 HTML 动画，用流动的粗笔触重现 Rick Astley 的舞步，配乐也由代码生成。
