  prompt: 'You''re a world class motion designer. Make a 15 second motion graphics lyric video for my song. Start dark, slow and melancholic with a ticking clock. At exactly 4 seconds, THE BEAT DROP: a flash, then neon color, bouncing shapes and screen shake like a club at midnight. Slam the lyrics in on the beat. At 13 seconds everything stops, black screen, the song title fades in. Cinematic, rhythmic, cut like it''s at 124 BPM. Single HTML file, plays full screen. Go all out.'
  prompt_lang: en
  prompt_zh: 你是世界级的动效设计师。为我的歌做一段 15 秒的动态图形歌词视频。开头要暗、慢、忧郁，配一个滴答作响的时钟。正好到第 4 秒，节拍落下（THE BEAT DROP）：一道闪光，接着是霓虹色彩、弹跳的几何图形和屏幕震动，像午夜的夜店。歌词踩着节拍重重砸进来。到第 13 秒一切停住，黑屏，歌名淡入。要有电影感和节奏感，按 124 BPM 的节奏来剪。做成单个 HTML 文件，全屏播放。拿出全部本事。
