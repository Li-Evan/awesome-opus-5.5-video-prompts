  prompt: 'Create a 90-second 1080p MP4 motion graphic on Apple''s history (1976–2026) in http://apple.com style: white/light-grey backgrounds, dark text, Inter font, short headlines ending in a period, lots of white space. Open on the Apple logo, then "The story of Apple." Follow Steve Jobs'' arc: garage, Apple II, IPO, Macintosh, forced out, NeXT/Pixar, return, iMac, iPod, iPhone, App Store, iPad, a tribute (1955–2011), then Tim Cook, Apple Watch, $1 trillion, M1, Vision Pro. End on "50 years of Apple." Use my uploaded photos in rounded cards with a slow zoom, and simple flat illustrations for products. Fast, beat-synced cuts. Original music that follows the mood: hopeful, then dark when Jobs is forced out, triumphant at his return, solo piano for the tribute, then a big finale.'
